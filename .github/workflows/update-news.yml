name: SIGNAL ニュース自動収集

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-news.js'
      - 'scripts/package.json'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存パッケージインストール
        run: cd scripts && npm install

      - name: ニュース収集
        run: cd scripts && node fetch-news.js

      - name: 生成結果確認
        run: |
          echo "=== data/meta.json ==="
          cat data/meta.json
          echo ""
          echo "=== news.json keys ==="
          node -e "const n=require('./data/news.json'); console.log(Object.keys(n)); for (const k of Object.keys(n)) console.log(k, Array.isArray(n[k]) ? n[k].length : 'not array')"

      - name: コミット & プッシュ
        run: |
          git config user.email "signal-bot@github.com"
          git config user.name "SIGNAL Bot"

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "変更なし、スキップ"
            exit 0
          fi

          cp data/news.json /tmp/news.json
          cp data/meta.json /tmp/meta.json
          [ -f data/news.backup.json ] && cp data/news.backup.json /tmp/news.backup.json || true

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/news.json data/news.json
          cp /tmp/meta.json data/meta.json
          [ -f /tmp/news.backup.json ] && cp /tmp/news.backup.json data/news.backup.json || true

          git add data/
          git commit -m "📰 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"

          for i in 1 2 3; do
            if git push; then
              echo "✅ プッシュ成功 (試行 $i)"
              exit 0
            fi

            echo "⚠️ プッシュ失敗 (試行 $i)、再同期..."
            sleep 3

            git fetch origin main
            cp /tmp/news.json data/news.json
            cp /tmp/meta.json data/meta.json
            [ -f /tmp/news.backup.json ] && cp /tmp/news.backup.json data/news.backup.json || true

            git reset --hard origin/main

            cp /tmp/news.json data/news.json
            cp /tmp/meta.json data/meta.json
            [ -f /tmp/news.backup.json ] && cp /tmp/news.backup.json data/news.backup.json || true

            git add data/
            git commit -m "📰 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"
          done

          echo "❌ 3回試行しても失敗"
          exit 1
