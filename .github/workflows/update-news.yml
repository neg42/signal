name: 📡 SIGNAL ニュース自動収集

on:
  schedule:
    - cron: '*/30 * * * *'   # 30分ごと
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

# 同時実行を完全に1つに制限（同じワークフローが走っていたらキューイング）
concurrency:
  group: news-fetch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ニュース収集
        run: node scripts/fetch-news.js

      - name: コミット & プッシュ（コンフリクト時は自動上書き）
        run: |
          git config user.email "signal-bot@github.com"
          git config user.name "SIGNAL Bot"

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "変更なし、スキップ"
            exit 0
          fi

          # 一旦data/の変更を退避
          git stash push -- data/

          # 最新のmainに同期
          git fetch origin main
          git reset --hard origin/main

          # 退避した変更を復元（最新データで上書き）
          git stash pop || true

          # コミット
          git add data/
          git commit -m "📰 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"

          # pushを最大3回リトライ
          for i in 1 2 3; do
            if git push; then
              echo "プッシュ成功 (試行 $i)"
              exit 0
            fi
            echo "プッシュ失敗 (試行 $i)、再同期..."
            sleep 3
            # コンフリクト時は強制的に最新に揃えてからdata/だけ復元
            git fetch origin main
            git stash push -- data/ || true
            git reset --hard origin/main
            git stash pop || true
            git add data/
            git commit --amend --no-edit -m "📰 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST" || git commit -m "📰 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"
          done

          echo "3回試行しても失敗"
          exit 1
