<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SIGNAL — パーソナルニュース</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">SIGNAL<span>Personal News</span></div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="category-nav">
      <div class="nav-label">カテゴリ</div>
      <ul id="categoryList"></ul>
    </nav>
    <div class="sidebar-section">
      <button class="settings-btn" id="openSettings">⚙&ensp;ソースを管理</button>
      <button class="settings-btn" id="refreshBtn">↻&ensp;今すぐ更新</button>
    </div>
    <div class="sidebar-footer">
      <div class="last-updated" id="lastUpdated">—</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="topbar-title" id="topbarTitle">すべてのニュース</div>
      <div class="topbar-actions">
        <button class="view-btn active" id="viewGrid" title="グリッド">▦</button>
        <button class="view-btn" id="viewList" title="リスト">☰</button>
        <input class="search-input" id="searchInput" type="text" placeholder="検索…" />
      </div>
    </header>

    <!-- ティッカーを専用コンテナで完全に封じ込める -->
    <div class="ticker-outer">
      <div class="ticker-label">LIVE</div>
      <div class="ticker-scroll">
        <div class="ticker-track" id="tickerTrack"></div>
      </div>
    </div>

    <section class="feed" id="feed">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>読み込み中…</p>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="settingsModal">
    <div class="modal-header">
      <h2>ニュースソース管理</h2>
      <button class="modal-close" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      <div class="source-categories" id="sourceCategories"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="articleBackdrop"></div>
  <div class="modal article-modal" id="articleModal">
    <div class="modal-header">
      <div class="article-meta-top" id="articleMetaTop"></div>
      <button class="modal-close" id="closeArticle">✕</button>
    </div>
    <div class="modal-body" id="articleBody"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
