<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGNAL — パーソナルニュース</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">SIGNAL</div>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>

    <nav class="category-nav">
      <div class="nav-label">カテゴリ</div>
      <ul id="categoryList"></ul>
    </nav>

    <div class="sidebar-section">
      <div class="nav-label">設定</div>
      <button class="settings-btn" id="openSettings">⚙ ソースを管理</button>
      <button class="settings-btn" id="refreshBtn">↻ 今すぐ更新</button>
    </div>

    <div class="sidebar-footer">
      <div class="last-updated" id="lastUpdated">—</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="topbar-title" id="topbarTitle">すべてのニュース</div>
      <div class="topbar-actions">
        <button class="view-btn active" id="viewGrid" title="グリッド表示">▦</button>
        <button class="view-btn" id="viewList" title="リスト表示">☰</button>
        <input class="search-input" id="searchInput" type="text" placeholder="検索..." />
      </div>
    </header>

    <div class="ticker-wrap" id="tickerWrap">
      <div class="ticker-label">LIVE</div>
      <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <section class="feed" id="feed">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>ニュースを読み込み中…</p>
      </div>
    </section>
  </main>

  <!-- SETTINGS MODAL -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="settingsModal">
    <div class="modal-header">
      <h2>ニュースソース管理</h2>
      <button class="modal-close" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-desc">カスタムRSSフィードURLを追加できます。RSS非対応サイトはHacker News・GNewsなどのAPIで自動収集されます。</p>

      <div class="source-categories" id="sourceCategories"></div>

      <div class="add-source-form">
        <div class="form-label">カスタムRSSフィードを追加</div>
        <div class="form-row">
          <input type="text" id="newFeedName" placeholder="名前（例: TechCrunch Japan）" />
          <input type="text" id="newFeedUrl" placeholder="RSS URL" />
          <select id="newFeedCategory">
            <option value="tech">テクノロジー・AI</option>
            <option value="business">ビジネス・経済</option>
            <option value="entertainment">エンタメ・ゲーム</option>
            <option value="politics">政治</option>
            <option value="society">社会</option>
            <option value="custom">カスタム</option>
          </select>
          <button class="add-btn" id="addFeedBtn">追加</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ARTICLE MODAL -->
  <div class="modal-backdrop" id="articleBackdrop"></div>
  <div class="modal article-modal" id="articleModal">
    <div class="modal-header">
      <div class="article-meta-top" id="articleMetaTop"></div>
      <button class="modal-close" id="closeArticle">✕</button>
    </div>
    <div class="modal-body" id="articleBody"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
